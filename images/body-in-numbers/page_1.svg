<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#F2F0EA"/>
  <rect x="104" y="86" width="992" height="728" rx="36" fill="#181916"/>
  <text x="160" y="165" fill="#F7F5EF" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Effective entries</text>
  <text x="160" y="207" fill="#AEB2A8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">Одна итоговая запись дня из ручных и автоматических источников.</text>
  <g transform="translate(182 260)">
    <rect x="0" y="0" width="260" height="560" rx="43" fill="#050605" stroke="#373A34" stroke-width="5"/>
    <rect x="16" y="18" width="228" height="524" rx="32" fill="#F8F6F0"/>
    <text x="39" y="76" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Сегодня</text>
    <text x="39" y="101" fill="#777A72" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Пятница, 4 сентября</text>
    <rect x="39" y="130" width="182" height="108" rx="24" fill="#141514"/>
    <text x="59" y="163" fill="#94EBDD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">ВЕС</text>
    <text x="59" y="205" fill="#F8F6F0" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">74.8</text>
    <text x="158" y="205" fill="#F8F6F0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">кг</text>
    <rect x="39" y="258" width="84" height="78" rx="20" fill="#E5F2EE"/>
    <text x="55" y="288" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800">Талия</text>
    <text x="55" y="316" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">83</text>
    <rect x="137" y="258" width="84" height="78" rx="20" fill="#F8E4CB"/>
    <text x="153" y="288" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800">Сон</text>
    <text x="153" y="316" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">7.2</text>
    <text x="39" y="380" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Быстрые записи</text>
    <rect x="39" y="404" width="182" height="34" rx="17" fill="#FFFFFF" stroke="#E0DDD4"/>
    <circle cx="56" cy="421" r="6" fill="#94EBDD"/>
    <text x="72" y="426" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Замер утром</text>
    <rect x="39" y="450" width="182" height="34" rx="17" fill="#FFFFFF" stroke="#E0DDD4"/>
    <circle cx="56" cy="467" r="6" fill="#F0B36E"/>
    <text x="72" y="472" fill="#141514" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Самочувствие 8/10</text>
  </g>
  <g transform="translate(520 286)">
    <text x="0" y="0" fill="#F7F5EF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Что решает логика</text>
    <line x1="0" y1="38" x2="430" y2="38" stroke="#393C36"/>
    <text x="0" y="90" fill="#F7F5EF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">01. Объединяет источники</text>
    <text x="0" y="122" fill="#AEB2A8" font-family="Inter, Arial, sans-serif" font-size="15">Apple Health и ручные правки не создают визуальные дубли.</text>
    <text x="0" y="190" fill="#F7F5EF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">02. Сохраняет приоритет</text>
    <text x="0" y="222" fill="#AEB2A8" font-family="Inter, Arial, sans-serif" font-size="15">Ручной ввод становится override и не ломает автосинхронизацию.</text>
    <text x="0" y="290" fill="#F7F5EF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">03. Держит контекст дня</text>
    <text x="0" y="322" fill="#AEB2A8" font-family="Inter, Arial, sans-serif" font-size="15">Пользователь видит одну понятную запись вместо технических конфликтов.</text>
  </g>
